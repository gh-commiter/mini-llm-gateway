name: Mini Gateway app (Swift)

on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Package.swift", "client/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["Sources/**", "Tests/**", "Package.swift", "client/**", ".github/workflows/swift.yml"]

permissions:
  contents: read

jobs:
  test:
    # Package.swift zahteva macOS 27 (SDK iz Xcode 27); GitHub ga ima le na sliki xcode-27 (predogled).
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      # 41 tests build the shared core helper (go build ./cmd/minigw-core) and failed on the runner with "go: No such file or directory".
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: swift build
      # Tests that need a socket outside loopback run the package's own build of mg-test-net on the runner (TestNet.locate): fail here, clearly, if it is not built.
      - name: mg-test-net is built
        run: test -x "$(swift build --show-bin-path)/mg-test-net" || { echo "::error::mg-test-net was not built next to the test products"; exit 1; }
      # A hang must name itself: after 20 minutes the test process is sampled (stacks of every thread) and the tests that started but never finished are listed.
      # Every 3 minutes a heartbeat line lists the tests running now (from the same log), so a run that is cancelled or lost (the 0.7.28 run was cancelled after 15 minutes,
      # cause unknown) still says where it was; the log is uploaded by the next step even then.
      - name: swift test
        env:
          # The pool-lag limit is 20 s on a developer's Mac (healthy runs there peak at 2-4 s). The hosted runner has 3 cores: the same
          # run queues about four times as long for a pool thread (16.7 s and 21.8 s seen with no stall). A real stall measured 88-91 s.
          MG_POOL_LAG_LIMIT: "45"
        run: |
          pending() { grep -E "Test .* (started|passed after|failed after|was cancelled|skipped)" "$RUNNER_TEMP/swift-test.log" | sed -E 's/^.*Test (.*) (started|passed after|failed after|was cancelled|skipped).*$/\1 \2/' | awk '$NF=="started"{s[$1]=1} $NF!="started"{delete s[$1]} END{for(k in s) print k}' | sort; }
          swift test > "$RUNNER_TEMP/swift-test.log" 2>&1 &
          test_pid=$!
          tail -n +1 -f "$RUNNER_TEMP/swift-test.log" &
          tail_pid=$!
          ( while sleep 180; do echo "::notice::heartbeat ${SECONDS}s: $(grep -cE 'Test .* (passed after|failed after)' "$RUNNER_TEMP/swift-test.log") tests finished; running now: $(pending | tr '\n' ' ')"; done ) &
          hb_pid=$!
          deadline=$((SECONDS + 1200))
          while kill -0 "$test_pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do sleep 5; done
          if kill -0 "$test_pid" 2>/dev/null; then
            echo "::error::swift test is still running after 20 minutes: sampling it"
            echo "== started, never finished"
            pending
            for p in $(pgrep -f 'swiftpm-testing-helper|xctest'); do
              echo "== sample of $p"
              sample "$p" 5 -file "$RUNNER_TEMP/sample-$p.txt" > /dev/null 2>&1 || true
              head -n 400 "$RUNNER_TEMP/sample-$p.txt" || true
            done
            kill "$test_pid" 2>/dev/null || true
            kill "$tail_pid" "$hb_pid" 2>/dev/null || true
            exit 1
          fi
          rc=0
          wait "$test_pid" || rc=$?
          sleep 1
          kill "$tail_pid" "$hb_pid" 2>/dev/null || true
          exit $rc
      - name: Upload swift test log
        if: always()  # also when the job is cancelled or times out: the partial log (and the samples of a hang) is what explains it
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: swift-test-log
          path: |
            ${{ runner.temp }}/swift-test.log
            ${{ runner.temp }}/sample-*.txt
          if-no-files-found: ignore
      # One cooperative thread instead of three (every core of a small runner): anything that blocks a pool thread (a semaphore or group wait, a blocking
      # read, a sleep inside an async test) stops these suites at once, instead of hanging a full run only now and then. Processes, pipes and the core helper.
      - name: swift test with a one-thread cooperative pool
        if: ${{ !cancelled() }}  # also when the full swift test failed (a failure there skips later steps by default); each failing step fails the job
        timeout-minutes: 10
        env:
          LIBDISPATCH_COOPERATIVE_POOL_STRICT: "1"
        run: swift test --filter "KBHookTests|CoreHelperTests|ProjectRunTests|UsageLossAtQuit|QuotaEngineGuards|QuotaProbeTree|NativeTests"
