name: Mini Gateway app (Swift)

on:
  push:
    branches: [main]
    paths: ["Sources/**", "Tests/**", "Package.swift", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["Sources/**", "Tests/**", "Package.swift", ".github/workflows/swift.yml"]

permissions:
  contents: read

jobs:
  test:
    # Package.swift zahteva macOS 27 (SDK iz Xcode 27); GitHub ga ima le na sliki xcode-27 (predogled).
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - run: swift build
      - run: swift test
