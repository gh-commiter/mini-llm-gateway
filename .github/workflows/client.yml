name: minigw client

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # bwrap in bwrap v bwrap (gnezdeni repozitoriji, .git pin): Ubuntu 24.04+ to z AppArmor privzeto prepove
      - name: bubblewrap for the gateway sandbox tests
        run: |
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: go test ./...
      - name: Cross-build (Windows, Linux, macOS)
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null . || exit 1
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
          done

  # Go 1.23+ ne sledi več stičiščem (junction) v EvalSymlinks: zbirko testov poganjamo tudi na pravem Windows.
  # TestMain (runIsolated) loči tek od profila izvajalca in konča z 2, če ga ne more.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - run: go test ./...
