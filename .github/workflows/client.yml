name: minigw client

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # the suite needs about 16 minutes on the Windows runner (0.7.28: 946 s for package minigw) and a failed run prints its summary after go test (-timeout 30m);
    # 20 minutes was the real limit and nearly reached, so the job gets room above go test's own limit
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # bwrap in bwrap v bwrap (gnezdeni repozitoriji, .git pin): Ubuntu 24.04+ to z AppArmor privzeto prepove
      - name: bubblewrap for the gateway sandbox tests
        run: |
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # the default 10 min per package is what the Windows runner needs for package minigw (520-580 s measured on 0.7.23 and 0.7.24; 0.7.25 hit the limit)
      # -json goes to gotest.json (artifact, for timings); the summary step prints failures and the slowest tests in the log
      - name: go test
        shell: bash
        run: |
          code=0
          go test -timeout 30m -json ./... > gotest.json || code=$?
          jq -Rr 'fromjson? // empty' gotest.json > gotest.events
          # a jq program, not a shell loop: on Windows jq writes CRLF, so the old `read` loop got names ending in \r and matched no output (0.7.28)
          echo "== failed tests and packages, with output =="
          jq -rs -f ../.github/workflows/gotest-failures.jq gotest.events
          echo "== 40 slowest tests per package (seconds) =="
          jq -rs '[.[] | select(.Test != null and (.Action == "pass" or .Action == "fail"))] | group_by(.Package)[] | (.[0].Package), (sort_by(-.Elapsed) | .[:40][] | "  \(.Elapsed)  \(.Test)")' gotest.events
          exit $code
      - name: Upload go test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gotest-${{ runner.os }}
          path: client/gotest.json
          if-no-files-found: ignore
      - name: Cross-build (Windows, Linux, macOS)
        run: |
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -trimpath -o /dev/null . || exit 1
            GOOS=${target%/*} GOARCH=${target#*/} go vet ./... || exit 1
          done

  # Go 1.23+ ne sledi več stičiščem (junction) v EvalSymlinks: zbirko testov poganjamo tudi na pravem Windows.
  # TestMain (runIsolated) loči tek od profila izvajalca in konča z 2, če ga ne more.
  windows:
    runs-on: windows-latest
    # the suite needs about 16 minutes on the Windows runner (0.7.28: 946 s for package minigw) and a failed run prints its summary after go test (-timeout 30m);
    # 20 minutes was the real limit and nearly reached, so the job gets room above go test's own limit
    timeout-minutes: 45
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: client/go.mod
          cache-dependency-path: client/go.sum
      # the default 10 min per package is what the Windows runner needs for package minigw (520-580 s measured on 0.7.23 and 0.7.24; 0.7.25 hit the limit)
      # -json goes to gotest.json (artifact, for timings); the summary step prints failures and the slowest tests in the log
      - name: go test
        shell: bash
        run: |
          code=0
          go test -timeout 30m -json ./... > gotest.json || code=$?
          jq -Rr 'fromjson? // empty' gotest.json > gotest.events
          # a jq program, not a shell loop: on Windows jq writes CRLF, so the old `read` loop got names ending in \r and matched no output (0.7.28)
          echo "== failed tests and packages, with output =="
          jq -rs -f ../.github/workflows/gotest-failures.jq gotest.events
          echo "== 40 slowest tests per package (seconds) =="
          jq -rs '[.[] | select(.Test != null and (.Action == "pass" or .Action == "fail"))] | group_by(.Package)[] | (.[0].Package), (sort_by(-.Elapsed) | .[:40][] | "  \(.Elapsed)  \(.Test)")' gotest.events
          exit $code
      - name: Upload go test timings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gotest-${{ runner.os }}
          path: client/gotest.json
          if-no-files-found: ignore
