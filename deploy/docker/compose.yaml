# Mini Gateway in Docker Compose (docs/docker.md): providers only. Updating: change MINIGW_VERSION, then
#   docker compose up -d --build
# A separate Dockerfile (not dockerfile_inline): the signature check is long, and a file can be read and reviewed.
name: ${COMPOSE_PROJECT_NAME:-minigw}

services:
  minigw:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${MINIGW_VERSION:?set MINIGW_VERSION to 0.7.6 or newer (the first release with container mode), for example in .env}
        SOURCE: release
    image: minigw:${MINIGW_VERSION:?set MINIGW_VERSION}
    command: ["--config", "/var/lib/minigw/config/serve.json"]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 1g
    ports:
      - "${MINIGW_BIND:-127.0.0.1}:${MINIGW_PORT:-8765}:8765"   # MINIGW_BIND=0.0.0.0 (or a LAN address) for other computers
    volumes:
      - config:/var/lib/minigw/config    # serve.json, keys, state and the core database (core/)
      - scratch:/var/lib/minigw/scratch  # Scratch: copies and sessions; can hold undelivered work
      # Admin profile only (docs/docker.md): the gateway's half of the certificates. Unused (an empty folder) without it.
      - ${MINIGW_ADMIN_CERTS:-./admin-certs}/gateway:/admin-tls:ro
    networks: [default, admin]           # port 8766 (remote settings) is never published; only the proxy can reach it

  # Optional: remote settings from a browser. docker compose --profile admin up -d
  # caddy 2.11.9 (current stable 2.x when this was written); the digest is the multi-arch index
  admin-proxy:
    profiles: [admin]
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    # a clear startup error instead of Caddy parsing an empty site address
    command: ["sh", "-c", "[ -n \"$$MINIGW_ADMIN_NAME\" ] || { echo 'set MINIGW_ADMIN_NAME to the external DNS name (docs/docker.md)' >&2; exit 1; }; exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile"]
    environment:
      MINIGW_ADMIN_NAME: ${MINIGW_ADMIN_NAME:-}
      XDG_DATA_HOME: /tmp/caddy-data
      XDG_CONFIG_HOME: /tmp/caddy-config
    init: true
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 256m
    ports:
      # MINIGW_ADMIN_BIND: the host address (a LAN address) to publish HTTPS on; loopback until you set it.
      # (A required variable would break every compose command without the profile, so the default is the safe one.)
      - "${MINIGW_ADMIN_BIND:-127.0.0.1}:${MINIGW_ADMIN_PORT:-443}:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${MINIGW_ADMIN_CERTS:-./admin-certs}/proxy:/certs:ro
    networks: [admin]                    # reaches only the gateway's remote settings listener

networks:
  admin:                                 # the dedicated proxy-to-gateway network

volumes:
  config:
  scratch:
