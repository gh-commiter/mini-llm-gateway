<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Gateway Settings</title>
<style nonce="{{NONCE}}">
:root { color-scheme: light dark; --bg: #ececec; --side: #e2e2e4; --panel: #ffffff; --text: #1d1d1f; --muted: #6e6e73;
  --line: #e5e5ea; --accent: #0a66d8; --sel: #d0d0d5; --btn: #e8e8ed; --ok: #28a745; --err: #d70015; --warn: #b25000;
  --hi: #fff7e0; --hiline: #f0c36d; --input: #ffffff; --inputline: #d2d2d7; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #1e1e1e; --side: #262628; --panel: #2c2c2e; --text: #f5f5f7; --muted: #98989d; --line: #3a3a3c;
    --accent: #3b8cff; --sel: #3a3a3c; --btn: #3a3a3c; --ok: #32d74b; --err: #ff6961; --warn: #ffa64d;
    --hi: #3a3220; --hiline: #8a6d2f; --input: #1c1c1e; --inputline: #48484a; }
}
* { box-sizing: border-box; }
body { margin: 0; font: 13px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text);
  display: flex; min-height: 100vh; }
nav { width: 220px; flex: none; background: var(--side); padding: 14px 10px; position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; }
nav .title { font-weight: 600; margin: 2px 8px 12px; }
nav .item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none;
  color: var(--text); padding: 5px 8px; border-radius: 6px; font: inherit; cursor: pointer; }
nav .item.sel { background: var(--sel); }
nav .ico { width: 20px; height: 20px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 700; flex: none; }
nav input.search { width: 100%; max-width: none; margin: 0 0 10px; padding: 3px 8px; border-radius: 6px; }
nav .spacer { flex: 1; }
nav .footer { display: flex; align-items: center; gap: 2px; margin: 8px 4px 0; position: relative; }
nav .footer .divider { width: 1px; height: 14px; background: var(--inputline); }
nav .menu { position: absolute; bottom: 28px; left: 0; background: var(--panel); border-radius: 8px; padding: 4px;
  box-shadow: 0 4px 16px rgba(0,0,0,.25); display: flex; flex-direction: column; min-width: 240px; }
nav .menu button { width: auto; height: auto; text-align: left; font-size: 13px; padding: 5px 10px; border-radius: 5px; }
nav .menu button:hover { background: var(--accent); color: #fff; }
.hidden { display: none !important; }
nav .footer button { width: 24px; height: 22px; border: 0; background: none; color: var(--text); font-size: 16px; cursor: pointer; border-radius: 4px; }
nav .footer button:disabled { color: var(--muted); cursor: default; }
main { flex: 1; padding: 20px 28px 40px; }
.content { max-width: 680px; margin: 0 auto; }
.card { background: var(--panel); border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 12px; }
.card .ico { width: 52px; height: 52px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px; font-weight: 700; }
.card h1 { font-size: 20px; margin: 8px 0 4px; }
.ico svg { width: 74%; height: 74%; }
.card p { margin: 0; color: var(--muted); }
h3 { font-size: 13px; margin: 18px 4px 6px; display: flex; align-items: center; justify-content: space-between; }
.group { background: var(--panel); border-radius: 10px; }
.group.hi { background: var(--hi); box-shadow: inset 0 0 0 1px var(--hiline); }
.row { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 7px 12px; }
.row + .row { border-top: 1px solid var(--line); }
.row .label { flex: 1; min-width: 0; }
.row .sub { color: var(--muted); font-size: 12px; }
.value { color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mono { font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 12px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.note { color: var(--muted); font-size: 11px; margin: 6px 4px 0; min-height: 14px; }
.note.err { color: var(--err); }
.warn { color: var(--warn); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--err); }
.dot.ok { background: var(--ok); }
input[type=text], input[type=password], input[type=number] { font: inherit; padding: 4px 8px; border: 1px solid var(--inputline);
  border-radius: 6px; background: var(--input); color: var(--text); width: 280px; max-width: 60%; text-align: right; }
input.left { text-align: left; }
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.buttons { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
button.btn { font: inherit; padding: 3px 12px; min-width: 84px; border-radius: 6px; border: 0; background: var(--btn); color: var(--text); cursor: pointer; }
button.btn.primary { background: var(--accent); color: #fff; }
button.btn:disabled { opacity: .5; cursor: default; }
h3 button.btn { font-weight: 400; }
input.wide { width: 100%; max-width: none; }
textarea { font: inherit; width: 100%; padding: 6px 8px; border: 1px solid var(--inputline); border-radius: 6px; background: var(--input); color: var(--text); resize: vertical; }
details.advanced { margin-top: 18px; }
details.advanced summary { font-weight: 600; cursor: pointer; margin: 0 4px 6px; }
button.btn.icon { min-width: 28px; padding: 3px 8px; }
.hbar { display: flex; gap: 8px; align-items: center; }
select { font: inherit; padding: 3px 8px; border: 1px solid var(--inputline); border-radius: 6px; background: var(--input); color: var(--text); }
a.link { color: var(--accent); text-decoration: none; }
a.btn { text-decoration: none; text-align: center; display: inline-block; }
.row.sub-row { min-height: 28px; padding: 4px 12px 4px 28px; }
.row.clickable { cursor: pointer; }
.row.selected { background: color-mix(in srgb, var(--accent) 20%, transparent); }
.row.plusminus { min-height: 30px; gap: 2px; }
.row.plusminus button { border: 0; background: none; color: var(--text); font-size: 16px; width: 24px; cursor: pointer; }
.row.plusminus button:disabled { color: var(--muted); cursor: default; }
.row.plusminus .divider { width: 1px; height: 14px; background: var(--inputline); }
.switch { position: relative; width: 38px; height: 22px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; background: var(--btn); border-radius: 11px; cursor: pointer; transition: background .15s; }
.switch span::after { content: ""; position: absolute; width: 18px; height: 18px; left: 2px; top: 2px; background: #fff; border-radius: 50%;
  box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: left .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { left: 18px; }
.switch input:disabled + span { opacity: .4; cursor: default; }
.filter { display: flex; gap: 8px; align-items: center; }
.filter input { width: 180px; text-align: left; }
#msg { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); background: var(--panel); color: var(--err);
  padding: 6px 12px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.2); display: none; }
</style>
</head>
<body>
<nav id="nav"></nav>
<main><div class="content" id="page"></div></main>
<div id="msg"></div>
<script nonce="{{NONCE}}">
"use strict";
// Seja: enkratni žeton iz fragmenta (#t=…, strežnik ga ne vidi) → POST login → ID v sessionStorage; vsak klic ga pošlje
// v glavi X-Minigw-Session. Brez piškotkov. Vse spremembe se uveljavijo same (kot nastavitve na Macu).
let SESSION = "";
try { SESSION = sessionStorage.getItem("minigw-session") || ""; } catch (e) {}
const PICKER = {{PICKER}};  // pladenj na Windows: okno za izbiro mape ali programa (POST /minigw/settings/pick)
let START = ["general", ""];  // #p=<pano>&g=<prehod>: povezava naravnost v pano
async function signIn() {
  const q = new URLSearchParams(location.hash.slice(1)), tok = q.get("t");
  if (q.get("p")) START = [q.get("p"), q.get("g") || ""];
  history.replaceState(null, "", location.pathname);
  if (!tok) return;
  const r = await fetch("/minigw/settings/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({t: tok})});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  SESSION = j.session;
  try { sessionStorage.setItem("minigw-session", SESSION); } catch (e) {}
}

// el: element brez innerHTML (podatki routerja so besedilo, nikoli HTML).
function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== false && v !== undefined && v !== null) e[k] = v;
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k);
  return e;
}

function loginGroup(kind, lg, patch, n) {
  lg = lg || {};

  const secret = (field, ph) => {

  const rows = [row(labelSub(t("login") + ": " + state, t("loginHint_" + kind)))];
  if (kind === "claude" || kind === "copilot") rows.push(row(labelSub(t("tokenField")), secret("token", lg.hasToken ? t("loginSet") : (kind === "claude" ? "sk-ant-oat01-…" : "github_pat_…")),

function devicesGlyph() {
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const shape = (tag, attrs) => { const e = document.createElementNS(ns, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); svg.append(e); };
  shape("rect", {x: 2.5, y: 5, width: 13, height: 9.5, rx: 1.5, fill: "none", stroke: "#fff", "stroke-width": 1.8});
  shape("rect", {x: 0.5, y: 16, width: 17, height: 2, rx: 1, fill: "#fff"});
  shape("rect", {x: 15.5, y: 8, width: 7, height: 12, rx: 1.6, fill: "#007aff", stroke: "#fff", "stroke-width": 1.8});
  shape("rect", {x: 17.8, y: 17.2, width: 2.4, height: 0.9, rx: 0.45, fill: "#fff"});

}

async function api(method, path, body) {
  const r = await fetch("/minigw/admin/v1" + path, {method, credentials: "omit", keepalive: true,  // tudi ob zapiranju strani
    headers: {"X-Minigw-Session": SESSION, "Content-Type": "application/json"}, body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error(t("signin"));
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return j;
}

// pick: okno za izbiro na računalniku prehoda (kind "folder" ali "exe"); "" ob preklicu.
async function pick(kind) {
  const r = await fetch("/minigw/settings/pick", {method: "POST", credentials: "omit",
    headers: {"X-Minigw-Session": SESSION, "Content-Type": "application/json"}, body: JSON.stringify({kind})});
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) throw new Error(t("signin"));
  if (!r.ok) throw new Error((j.error && j.error.message) || ("HTTP " + r.status));
  return j.path || "";
}

async function save(n, fn, ok) {
  n.className = "note"; n.textContent = t("saving");
  try { const r = await fn(); n.textContent = ok ? ok(r) : t("saved"); return r; } catch (e) { n.className = "note err"; n.textContent = e.message; }
}
// Čakajoča tipkanja se shranijo tudi, ko se stran zapre ali skrije (kot Mac ob zapiranju okna, F7).
const pending = new Map();
function autosave(input, n, fn, ok) {
  let timer;
  const run = () => { clearTimeout(timer); pending.delete(input); save(n, () => fn(input.value.trim()), ok); };
  input.addEventListener("input", () => { clearTimeout(timer); pending.set(input, run); timer = setTimeout(run, 800); });
}
const flushPending = () => [...pending.values()].forEach(run => run());
addEventListener("pagehide", flushPending);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushPending(); });

// agentPane: Codex CLI ali Grok CLI (kot panoja na Macu): vklop, program, modeli, dovoljene mape, sandbox.
async function agentPane(kind) {
  const [a, c, st, m] = await Promise.all([api("GET", "/agents/" + kind), api("GET", "/agents/claude"), api("GET", "/status"),
    api("GET", "/agents/" + kind + "/models").catch(() => ({models: []}))]);
  const win = st.os === "windows", codex = kind === "codex";
  const n1 = note(), n2 = note(), n3 = note(t(codex ? "codexFooter" : "grokFooter"));
  const patch = body => api("PATCH", "/agents/" + kind, body);
  const path = el("input", {type: "text", value: a.path, placeholder: a.exe || kind});
  const status = el("span", {class: "sub"}, el("span", {class: "dot" + (a.found ? " ok" : "")}), a.found ? t("detectedAt", a.exe, "").replace(/ · $/, "") : t(kind + "NotFound"));
  autosave(path, n1, async v => { await patch({path: v}); show(kind); });
  const models = m.models;
  const all = models.map(x => x.slug);
  let enabled = a.models === null ? null : [...a.models];
  const setModel = (slug, on) => {
    let list = enabled === null ? [...all] : enabled.filter(x => x !== slug);
    if (on && !list.includes(slug)) list.push(slug);
    if (!on) list = list.filter(x => x !== slug);

  const lockedText = codex && st.os === "windows" ? "codexLockedWin" : "agentLockedWin";  // #68: Codex na Windows s svojim peskovnikom
  return [

        toggle(a.enabled && !locked, v => save(n1, async () => { await patch({enabled: v}); nav(); }), locked)),
      row(labelSub(t("path")), path, browse(path, n1, async v => { await patch({path: v}); show(kind); }))),
    el("div", {class: "note"}, status),

    const enc = encodeURIComponent(name);
    const n1 = note(t("auto")), n2 = note(), n3 = note(t("aliasesHint"));
    const patch = body => api("PATCH", "/providers/" + enc, body);
    const nameIn = el("input", {type: "text", value: g.name, disabled: BUILTIN.includes(g.name.toLowerCase())});
    autosave(nameIn, n1, async v => { const r = await patch({name: v}); show("gateway", r.gateway.name); return r; });
    const url = el("input", {type: "text", value: g.baseURL});
    autosave(url, n1, v => patch({baseURL: v}));
    const key = el("input", {type: "password", autocomplete: "off", placeholder: g.hasKey ? t("keySaved") : t("key")});
    autosave(key, n1, v => api("POST", "/providers", {name, baseURL: url.value.trim(), key: v, insecure: g.insecure}).then(r => { key.value = ""; show("gateway", name); return r; }),
      () => t("saved"));
    const aliases = el("textarea", {class: "mono", rows: 4, value: g.aliases, placeholder: "qwen = qwen/qwen3-coder, 128k"});
    autosave(aliases, n3, v => patch({aliases: v}));

    const search = el("input", {type: "text", class: "left", placeholder: t("searchModels")});
    let models = [];
    const status = el("span", {class: "sub", textContent: t(g.enabled ? "loading" : "enableToLoad")});
    const list = group();
    const render = () => {
      const f = search.value.trim().toLowerCase();
      const hits = models.filter(m => !f || m.id.toLowerCase().includes(f) || m.model.toLowerCase().includes(f));
      const sorted = [...hits.filter(m => m.enabled), ...hits.filter(m => !m.enabled)];  // vklopljeni najprej (kot na Macu)
      status.textContent = t("enabledOf", models.filter(m => m.enabled).length, models.length);
      list.replaceChildren(...sorted.map(m => row(labelSub(m.id, m.model === m.id ? null : "/model " + m.model),
        value(m.window ? Math.round(m.window / 1000) + "K" : ""),
        toggle(m.enabled, (v, i) => save(n2, async () => {
          try { await api("POST", "/providers/" + enc + "/models", v ? {enable: [m.id]} : {disable: [m.id]}); m.enabled = v; render(); }
          catch (e) { i.checked = !v; throw e; }
        })))));
    };
    const load = async () => {
      if (!g.enabled) return;
      status.textContent = t("loading");
      try { models = (await api("GET", "/providers/" + enc + "/models")).models; render(); }
      catch (e) { status.textContent = "⚠ " + e.message; list.replaceChildren(); }
    };
    search.addEventListener("input", render);
    const bulk = on => save(n2, async () => { await api("POST", "/providers/" + enc + "/models", {all: on}); await load(); });
    load();
    return [
      card(gwIcon(g)[0], gwIcon(g)[1], name, t("gatewayDesc")),
      group(
        row(labelSub(t("enabled"), g.hasKey ? null : t("enterKey")), toggle(g.enabled && g.hasKey, v => save(n1, async () => { await patch({enabled: v}); show("gateway", name); }), !g.hasKey)),
        row(t("name"), nameIn), row(t("url"), url),
        row(labelSub(t("insecure"), null), toggle(g.insecure, v => save(n1, () => patch({insecure: v})))),
        row(labelSub(t("key"), t("keyStoredShort")), key)),
      n1,
      el("h3", {}, el("span", {textContent: t("models")}), el("div", {class: "hbar"},
        buttons(button(t("enableAll"), () => bulk(true)), button(t("disableAll"), () => bulk(false))),
        el("button", {class: "btn icon", textContent: "↻", title: t("refresh"), disabled: !g.enabled, onclick: () => load()}))),
      el("div", {class: "note", style: "margin:0 4px 6px"}, status),
      el("div", {class: "filter", style: "margin:0 4px 8px"}, search),
      list, n2,
      el("details", {class: "advanced"}, el("summary", {textContent: t("aliases")}), group(row(aliases)), n3),
    ];
  },

  async addGateway(preset) {
    const [pname, purl, pins] = PRESETS[preset] || PRESETS.other;
    const n = note(t("keyStored"));
    const name = el("input", {type: "text", value: pname || t("gateway")}), url = el("input", {type: "text", value: purl});
    const key = el("input", {type: "password", autocomplete: "off"});
    let insecure = pins;
    return [
      card("linear-gradient(#ffcc00,#ff9500)", "+", t("addGateway"), t("gatewaysDesc")),
      group(row(t("name"), name), row(t("url"), url), row(t("key"), key), row(t("insecure"), toggle(insecure, v => { insecure = v; }))),
      el("div", {class: "row", style: "justify-content:flex-end;padding:8px 0"}, buttons(button(t("add"), () => save(n, async () => {
        const r = await api("POST", "/providers", {name: name.value.trim(), baseURL: url.value.trim(), key: key.value.trim(), insecure});
        await nav(); show("gateway", r.gateway.name);
      }), true))),
      n,
    ];
  },

  async claude() {
    const [c, st] = await Promise.all([api("GET", "/agents/claude"), api("GET", "/status")]);
    shownClaude = JSON.stringify(c);
    const win = st.os === "windows";
    const n0 = note(), n1 = note(), n2 = note(), n4 = note(t("cliHint"));
    const patch = body => api("PATCH", "/agents/claude", body);
    const on = new Set((c.tools || "").split(",").filter(Boolean));
    const path = el("input", {type: "text", value: c.path, placeholder: c.exe || (win ? "C:\\Users\\you\\.local\\bin\\claude.exe" : "/usr/local/bin/claude")});
    const status = el("span", {class: "sub"});
    const showStatus = x => status.replaceChildren(el("span", {class: "dot" + (x.found ? " ok" : "")}),
      x.found ? (x.path ? (x.version || "claude") : t("detectedAt", x.exe || "", x.version || "")) : t("notFound"));
    showStatus(c);
    autosave(path, n1, async v => showStatus(await patch({path: v})));
    const sendTools = async () => showStatus(await patch({tools: [...on].join(",")}));
    const toolRow = ([name, en, sl], disabled) => row(labelSub(name, SL ? sl : en), toggle(on.has(name), (v, i) => save(n2, async () => {
      v ? on.add(name) : on.delete(name);
      try { await sendTools(); } catch (e) { v ? on.delete(name) : on.add(name); i.checked = !v; throw e; }
    }), disabled));
    const bulk = v => save(n2, async () => { for (const [n] of TOOLS) v ? on.add(n) : on.delete(n); await sendTools(); show("claude"); });
    const box = !!(st.agentSandbox && st.agentSandbox.kind === "mxc");  // #68: škatla MXC na Windows
    const cmdLocked = win && !box && !c.allowUnsandboxedBash;
    const sources = el("input", {type: "text", value: c.settingSources, placeholder: t("none")});
    autosave(sources, n2, v => patch({settingSources: v}));
    const mode = el("select", {}, ...["dontAsk", "acceptEdits", "auto", "plan"].map(m => el("option", {value: m, textContent: m, selected: c.permissionMode === m})));
    mode.addEventListener("change", () => save(n2, () => patch({permissionMode: mode.value})));

    // Z »Allow local tools« ima agent vsa orodja Claude Code razen izjem (tabela kot na Macu); sicer izbrana orodja.
    let toolsPart;
    if (c.allowLocalTools) {
      const list = group(row(el("span", {class: "label sub", textContent: t("loading")})));
      const off = new Set(c.disabledTools || []);
      api("GET", "/agents/claude/tools").then(r => {
        const all = [...new Set([...r.tools, ...off])].sort();
        const send = () => patch({disabledTools: [...off]});
        list.replaceChildren(...(all.length ? all.map(name => row(name, toggle(!off.has(name), (v, i) => save(n2, async () => {
          v ? off.delete(name) : off.add(name);
          try { await send(); } catch (e) { v ? off.add(name) : off.delete(name); i.checked = !v; throw e; }
        })))) : [row(el("span", {class: "label sub", textContent: t("noTools")}))]));
        list.bulk = v => save(n2, async () => { off.clear(); if (!v) all.forEach(x => off.add(x)); await send(); show("claude"); });
      }, e => list.replaceChildren(row(el("span", {class: "label", textContent: e.message}))));
      toolsPart = [section(t("tools"), button(t("enableAll"), () => list.bulk && list.bulk(true)), button(t("disableAll"), () => list.bulk && list.bulk(false))), list];
    } else {
      toolsPart = [
        section(t("tools"), button(t("enableAll"), () => bulk(true)), button(t("disableAll"), () => bulk(false))),
        group(TOOLS.map(x => toolRow(x, false))),
        section(t("commands")),
        group(win ? row(labelSub(t("unsandboxed"), box ? t("unsandboxedNotNeeded") : null), toggle(c.allowUnsandboxedBash, v => save(n2, async () => {
            const body = {allowUnsandboxedBash: v};
            if (!v) { for (const [n] of COMMANDS) on.delete(n); body.tools = [...on].join(","); }
            await patch(body); show("claude");
          }))) : null,
          win && !box ? row(el("div", {class: "label warn", textContent: t("unsandboxedWarn")}))
            : row(el("div", {class: "label sub", textContent: t(box ? "sandboxNoteWin" : "sandboxNote")})),
          COMMANDS.filter(x => win || x[0] !== "PowerShell").map(x => toolRow(x, cmdLocked))),
      ];
    }
    return [
      card(...ICON.claude, t("claude"), t("claudeDesc")),
      group(row(t("enabled"), toggle(c.enabled, (v, i) => save(n0, async () => {
        try { await patch({enabled: v}); } catch (e) { i.checked = !v; throw e; } // napaka ostane pod stikalom
        show("claude");
      }))),
        c.off ? row(el("div", {class: "label warn", textContent: t("claudeOff", c.off)})) : null), n0,
      group(row(labelSub(t("path")), path, button(t("find"), () => save(n1, async () => { path.value = ""; showStatus(await patch({path: ""})); })),
        browse(path, n1, async v => showStatus(await patch({path: v}))))),
      el("div", {class: "note"}, status), n1,
      section(t("login")), loginGroup("claude", c.login, patch, n1),
      section(t("allowedFolders")), folderList(c.folders, v => patch({folders: v}), t("allowedFoldersHint"), win, c.leftOut),
      box ? el("div", {class: "note warn", textContent: t("pathHomeWarn")}) : null,
      el("div", {style: "height:12px"}),
      group(row(labelSub(t("localTools"), win ? t(box ? "localToolsBox" : "localToolsWin") : t("localToolsHelp")), toggle(c.allowLocalTools, v => save(n2, async () => { await patch({allowLocalTools: v}); show("claude"); }))),
        c.allowLocalTools ? null : row(t("permissionMode"), mode),
        row(labelSub(t("settingSources"), t("settingSourcesHelp")), sources),
        workRow(c, patch, n2),
        row(labelSub(t("askOthers"), t("askOthersClaudeHelp")), toggle(c.askOthers, v => save(n2, () => patch({askOthers: v})), !c.allowLocalTools))),
      n2,
      ...toolsPart,
      section(t("cliTool")),
      group(row(labelSub("minigw", st.installDir ? t("installedAt", st.installDir) : t("notInstalled")),
        buttons(el("a", {class: "btn", href: "https://github.com/gh-commiter/mini-llm-gateway/releases/latest", target: "_blank", rel: "noopener noreferrer",
          textContent: t("download")})))),
      n4,
    ];
  },
};

let current = "general", currentArg = "", gateways = [], shownClaude = "";
const openHistory = new Set(); // naprave z odprto zgodovino (ostane ob osvežitvi vsakih 5 s)
let openSession = "";
// Ikone stranske vrstice (kot na Macu: barvna ploščica z znakom).
const ICON = {general: ["#8e8e93", "⚙"], devices: ["#007aff", devicesGlyph], sessions: ["#34c759", "◷"], claude: ["#b8743c", ">_"], codex: ["#30b0c7", "</>"], grok: ["#5856d6", "✦"], copilot: ["#6e7781", "◎"], foundry: ["#0f6cbd", "◈"]};
const gwIcon = g => /openrouter\.ai/.test(g.baseURL) ? ["#af52de", "◈"] : ["#007aff", "▤"];
let search = "";
const PRESETS = {litellm: ["LiteLLM", "http://localhost:4000", true], openrouter: ["OpenRouter", "https://openrouter.ai/api", false], other: [null, "https://", false]};

async function nav() {
  try { gateways = (await api("GET", "/providers")).providers; } catch (e) { gateways = []; }
  const item = (page, label, [color, glyph], arg) => el("button", {class: "item" + (current === page && currentArg === (arg || "") ? " sel" : ""),
    onclick: () => show(page, arg)}, el("span", {class: "ico", style: "background:" + color}, glyphNode(glyph)), label);
  const sel = current === "gateway" ? currentArg : "";
  const items = [
    ["general", t("general"), ICON.general],
    ...gateways.map(g => ["gateway", g.name, gwIcon(g), g.name]),
    ["foundry", "Foundry Local", ICON.foundry],  // vrstni red kot na Macu (brez Siri AI in Apple FM)
    ["claude", t("claude"), ICON.claude],
    ...(pages.codex ? [["codex", "Codex CLI", ICON.codex]] : []),
    ["copilot", "Copilot CLI", ICON.copilot],
    ...(pages.grok ? [["grok", "Grok CLI", ICON.grok]] : []),
    ["devices", t("devices"), ICON.devices],
    ["sessions", t("sessions"), ICON.sessions],
  ].filter(x => !search || x[1].toLowerCase().includes(search.toLowerCase()));
  const find = el("input", {type: "text", class: "left search", placeholder: t("search"), value: search});
  find.addEventListener("input", () => { search = find.value; nav().then(() => { const f = document.querySelector("nav .search"); f.focus(); f.setSelectionRange(search.length, search.length); }); });
  const menu = el("div", {class: "menu hidden"},
    ...Object.keys(PRESETS).map(k => el("button", {textContent: k === "other" ? t("otherGateway") : PRESETS[k][0], onclick: () => { menu.classList.add("hidden"); show("addGateway", k); }})));
  document.getElementById("nav").replaceChildren(
    find,
    ...items.map(x => item(x[0], x[1], x[2], x[3])),
    el("div", {class: "spacer"}),
    el("div", {class: "footer"},
      el("button", {textContent: "+", title: t("addGateway"), onclick: () => menu.classList.toggle("hidden")}),
      el("span", {class: "divider"}),
      el("button", {textContent: "−", title: t("remove"), disabled: !sel || BUILTIN.includes(sel.toLowerCase()), onclick: async () => {
        if (!confirm(t("removeGateway", sel))) return;
        try { await api("DELETE", "/providers/" + encodeURIComponent(sel)); await show("general"); } catch (e) { toast(e.message); }
      }}), menu));
}

async function show(page, arg) {
  current = page; currentArg = arg || "";
  await nav();
  try {
    document.getElementById("page").replaceChildren(...(await pages[page](arg)));
  } catch (e) { toast(e.message); }
}
// Devices in Claude CLI: spremembe od drugod (minigw gw …, tray) se pokažejo; Claude CLI le ob spremembi (ohrani izbiro mape).
setInterval(() => {
  if (document.visibilityState !== "visible" || document.activeElement.matches("input")) return;
  if (current === "devices") show("devices");
  if (current === "claude") api("GET", "/agents/claude").then(c => { if (current === "claude" && JSON.stringify(c) !== shownClaude) show("claude"); }, () => {});
}, 5000);
signIn().then(() => show(Object.hasOwn(pages, START[0]) ? START[0] : "general", START[1]), e => toast(e.message));
</script>
</body>
